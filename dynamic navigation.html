<!DOCTYPE html>
<html>
<head>
    <title>Login & Registration</title>
</head>
<body>

<nav>
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="showLogin()">Login</a>
    <a href="#" onclick="showRegister()">Register</a>
    <a href="#" id="logout" onclick="logout()">Logout</a>
</nav>

<div id="content"></div>

<script>
let loggedIn = false;

function showHome() {
    document.getElementById("content").innerHTML =
        "<h2>Home Page</h2>";
}

function showLogin() {
    document.getElementById("content").innerHTML = `
        <h2>Login</h2>

        <input id="loginEmail" placeholder="Email"><br><br>
        <input id="loginPassword" type="password" placeholder="Password"><br><br>

        <button onclick="login()">Login</button>

        <p id="message"></p>
    `;
}

function showRegister() {
    document.getElementById("content").innerHTML = `
        <h2>Register</h2>

        <input id="name" placeholder="Name"><br><br>
        <input id="email" placeholder="Email"><br><br>
        <input id="phone" placeholder="Phone Number"><br><br>
        <input id="password" type="password" placeholder="Password"><br><br>

        <button onclick="register()">Register</button>

        <p id="message"></p>
    `;
}

function login() {
    let email = document.getElementById("loginEmail").value;
    let password = document.getElementById("loginPassword").value;

    if (email == "" || password == "") {
        document.getElementById("message").innerHTML =
            "Please fill all fields";
        return;
    }

    if (!email.includes("@")) {
        document.getElementById("message").innerHTML =
            "Enter a valid email";
        return;
    }

    if (password.length < 6) {
        document.getElementById("message").innerHTML =
            "Password must be at least 6 characters";
        return;
    }

    loggedIn = true;
    updateNavigation();

    document.getElementById("message").innerHTML =
        "Login successful!";
}

function register() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let password = document.getElementById("password").value;

    if (!name || !email || !phone || !password) {
        document.getElementById("message").innerHTML =
            "All fields are required";
        return;
    }

    if (!email.includes("@")) {
        document.getElementById("message").innerHTML =
            "Enter a valid email";
        return;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        document.getElementById("message").innerHTML =
            "Enter a valid 10-digit phone number";
        return;
    }

    if (password.length < 6) {
        document.getElementById("message").innerHTML =
            "Password must be at least 6 characters";
        return;
    }

    document.getElementById("message").innerHTML =
        "Registration successful!";
}

function logout() {
    loggedIn = false;
    updateNavigation();
    showHome();
}

function updateNavigation() {
    document.querySelectorAll("nav a")[1].style.display =
        loggedIn ? "none" : "inline";

    document.querySelectorAll("nav a")[2].style.display =
        loggedIn ? "none" : "inline";

    document.getElementById("logout").style.display =
        loggedIn ? "inline" : "none";
}

updateNavigation();
showHome();
</script>

</body>
</html>
