<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Ledger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="mark">&#128214;</span> Ledger</a>
    <div class="nav-links"></div>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-outline btn-sm">Back to log in</a>
    </div>
  </div>
</nav>

<div class="center-page">
  <div class="auth-box card card-pad" style="max-width:420px;">
    <span class="eyebrow">One more step</span>
    <h1>Set a new password</h1>
    <p class="muted" style="margin-bottom:22px;">Choose something you haven't used before on this account.</p>

    <form action="#" method="POST">
      <div class="field">
        <label for="password">New password</label>
        <input class="input" type="password" id="password" name="password" placeholder="••••••••" required>
        <div class="hint">At least 8 characters, with a number and a symbol.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input class="input" type="password" id="confirm" name="confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Reset password</button>
    </form>

    <div class="auth-switch">Changed your mind? <a href="login.html">Return to log in</a></div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div><strong>Ledger</strong> — Student Course Management &amp; Learning Progress Tracking System</div>
    <div class="footer-links">
      <a href="login.html">Log in</a>
      <a href="register.html">Register</a>
    </div>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
