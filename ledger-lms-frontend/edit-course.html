<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Course — Ledger Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="admin-dashboard.html" class="brand"><span class="mark">&#128214;</span> Ledger <span class="badge badge-gold" style="margin-left:6px;">Admin</span></a>
    <div class="nav-links"></div>
    <div class="nav-cta"><div class="nav-avatar">MN</div></div>
  </div>
</nav>

<div class="dash-shell">
  <aside class="sidebar">
    <div class="group-label">Overview</div>
    <a href="admin-dashboard.html">&#128202; Dashboard</a>
    <div class="group-label">Courses</div>
    <a href="courses.html" class="active">&#128218; All courses</a>
    <a href="add-course.html">&#10133; Add course</a>
    <div class="group-label">Account</div>
    <a href="notifications.html">&#128276; Notifications</a>
    <a href="login.html">&#8630; Log out</a>
  </aside>

  <main class="dash-main">
    <div class="dash-header">
      <div>
        <span class="eyebrow">Course management</span>
        <h1 style="margin:0;">Edit course</h1>
      </div>
      <a href="courses.html" class="btn btn-outline">Back to courses</a>
    </div>

    <div class="card card-pad" style="max-width:680px;">
      <form action="#" method="POST">
        <div class="form-success">Changes are saved automatically to the ledger once you click "Update course."</div>

        <div class="field">
          <label for="course_name">Course name</label>
          <input class="input" type="text" id="course_name" name="course_name" value="Full Stack Development" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="instructor">Instructor</label>
            <input class="input" type="text" id="instructor" name="instructor" value="Meera Nair" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select class="input" id="category" name="category">
              <option>Programming</option>
              <option selected>Web</option>
              <option>AI</option>
              <option>Database</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="duration">Duration (weeks)</label>
            <input class="input" type="number" id="duration" name="duration" value="12" min="1" required>
          </div>
          <div class="field">
            <label for="modules">Number of modules</label>
            <input class="input" type="number" id="modules" name="modules" value="6" min="1" required>
          </div>
        </div>

        <div class="field">
          <label for="description">Course description</label>
          <textarea class="input" id="description" name="description">Go from a static page to a deployed application — HTML, CSS, JavaScript, React, Node.js and MongoDB, taught as one continuous build.</textarea>
        </div>

        <div class="field">
          <label for="status">Publish status</label>
          <select class="input" id="status" name="status">
            <option>Draft</option>
            <option selected>Active</option>
          </select>
        </div>

        <div style="display:flex;gap:12px;margin-top:8px;justify-content:space-between;">
          <div style="display:flex;gap:12px;">
            <button type="submit" class="btn btn-primary">Update course</button>
            <a href="courses.html" class="btn btn-outline">Cancel</a>
          </div>
          <a href="#" class="btn btn-danger">Delete course</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/script.js"></script>
</body>
</html>
