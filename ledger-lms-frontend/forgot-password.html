<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Ledger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="mark">&#128214;</span> Ledger</a>
    <div class="nav-links"></div>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-outline btn-sm">Back to log in</a>
    </div>
  </div>
</nav>

<div class="center-page">
  <div class="auth-box card card-pad" style="max-width:420px;">
    <span class="eyebrow">Account recovery</span>
    <h1>Forgot your password?</h1>
    <p class="muted" style="margin-bottom:22px;">Enter the email on your account and we'll send a secure link to reset it.</p>

    <form action="#" method="POST">
      <div class="field">
        <label for="email">Email address</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>

    <div class="auth-switch">Remembered it after all? <a href="login.html">Log in</a></div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div><strong>Ledger</strong> — Student Course Management &amp; Learning Progress Tracking System</div>
    <div class="footer-links">
      <a href="login.html">Log in</a>
      <a href="register.html">Register</a>
    </div>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
