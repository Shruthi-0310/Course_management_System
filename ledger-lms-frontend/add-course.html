<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Course — Ledger Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="admin-dashboard.html" class="brand"><span class="mark">&#128214;</span> Ledger <span class="badge badge-gold" style="margin-left:6px;">Admin</span></a>
    <div class="nav-links"></div>
    <div class="nav-cta"><div class="nav-avatar">MN</div></div>
  </div>
</nav>

<div class="dash-shell">
  <aside class="sidebar">
    <div class="group-label">Overview</div>
    <a href="admin-dashboard.html">&#128202; Dashboard</a>
    <div class="group-label">Courses</div>
    <a href="courses.html">&#128218; All courses</a>
    <a href="add-course.html" class="active">&#10133; Add course</a>
    <div class="group-label">Account</div>
    <a href="notifications.html">&#128276; Notifications</a>
    <a href="login.html">&#8630; Log out</a>
  </aside>

  <main class="dash-main">
    <div class="dash-header">
      <div>
        <span class="eyebrow">Course management</span>
        <h1 style="margin:0;">Add a new course</h1>
      </div>
      <a href="courses.html" class="btn btn-outline">Cancel</a>
    </div>

    <div class="card card-pad" style="max-width:680px;">
      <form action="#" method="POST">
        <div class="field">
          <label for="course_name">Course name</label>
          <input class="input" type="text" id="course_name" name="course_name" placeholder="e.g. Advanced CSS Techniques" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="instructor">Instructor</label>
            <input class="input" type="text" id="instructor" name="instructor" placeholder="Faculty name" required>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select class="input" id="category" name="category">
              <option>Programming</option>
              <option>Web</option>
              <option>AI</option>
              <option>Database</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="duration">Duration (weeks)</label>
            <input class="input" type="number" id="duration" name="duration" placeholder="8" min="1" required>
          </div>
          <div class="field">
            <label for="modules">Number of modules</label>
            <input class="input" type="number" id="modules" name="modules" placeholder="5" min="1" required>
          </div>
        </div>

        <div class="field">
          <label for="description">Course description</label>
          <textarea class="input" id="description" name="description" placeholder="What will students learn in this course?"></textarea>
        </div>

        <div class="field">
          <label for="status">Publish status</label>
          <select class="input" id="status" name="status">
            <option>Draft</option>
            <option>Active</option>
          </select>
        </div>

        <div style="display:flex;gap:12px;margin-top:8px;">
          <button type="submit" class="btn btn-primary">Save course</button>
          <a href="courses.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/script.js"></script>
</body>
</html>
